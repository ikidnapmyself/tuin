name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: use system bash on macOS
        if: runner.os == 'macOS'
        run: echo "/bin" >> "$GITHUB_PATH"
      - name: bash version
        run: |
          bash --version | head -1
          if [ "${{ runner.os }}" = macOS ]; then
            bash --version | head -1 | grep -q 'version 3\.2' || { echo "expected bash 3.2 on macOS"; exit 1; }
          fi
      - name: run BATS
        run: tests/test_helper/bats-core/bin/bats tests/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: lint tuin.sh, examples, and test helper
        run: |
          shellcheck tuin.sh
          shellcheck examples/*.sh
          shellcheck tests/test_helper/common-setup.bash
